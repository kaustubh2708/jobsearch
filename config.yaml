# =============================================================================
#  LocalJobAgent — configuration
#  Everything the agent does is driven from this file. Edit, then `./run.sh`.
# =============================================================================

profile:
  full_name: "Kaustubh Singh"
  email: "kaustubhsk2708@gmail.com"
  phone: ""                       # <-- fill in, required by most application forms
  location: "Bengaluru, India"
  linkedin: "https://linkedin.com/in/kaustubh2708"
  github: "https://github.com/kaustubh2708"
  portfolio: "https://ara.computer"
  # Used to answer the standard screening questions automatically.
  years_experience: 4
  current_ctc_lpa: null           # e.g. 24  (null = "prefer not to say")
  expected_ctc_lpa: null          # e.g. 45
  notice_period_days: 30
  willing_to_relocate: true
  needs_visa_sponsorship: false
  authorized_india: true
  gender: ""                      # optional, some Indian portals require it
  date_of_birth: ""               # YYYY-MM-DD, optional

resume:
  # Directory scanned for your resume. First matching file wins.
  # Supported: .pdf .docx .txt .md .pages
  dir: "resume"
  # Path to the PDF that actually gets uploaded to application forms.
  # Export your resume to PDF and put it here.
  upload_pdf: "resume/KaustubhSingh_Resume.pdf"

llm:
  host: "http://localhost:11434"
  # Reasoning model — scores job compatibility and answers form questions.
  # 12GB+ VRAM: qwen2.5:14b-instruct  (best quality/size balance)
  # 24GB VRAM:  qwen2.5:32b-instruct  (noticeably better JD reasoning)
  # 8GB VRAM:   llama3.1:8b-instruct-q4_K_M
  chat_model: "qwen2.5:14b-instruct"
  # Embedding model — cheap first-pass similarity screen.
  embed_model: "nomic-embed-text"
  temperature: 0.1
  num_ctx: 8192
  request_timeout_s: 240

search:
  # Roles the agent searches for. Leave empty [] to let the LLM derive them
  # from your resume on first run (recommended — run `jobagent profile`).
  queries: []
  locations:
    - "Bengaluru, India"
    - "India"
  remote_ok: true
  hours_old: 168                  # 168h = published in the last 7 days
  # Daily targets. Agent keeps searching until it has this many *scored* jobs.
  target_jobs_per_day: 20
  min_jobs_per_day: 15
  max_jobs_per_day: 25
  # Hard filters applied before the LLM ever sees a job.
  exclude_title_keywords:
    - "intern"
    - "internship"
    - "trainee"
    - "fresher"
    - "sales"
    - "bpo executive"
    - "recruiter"
  exclude_companies: []
  min_salary_lpa: null            # e.g. 25 -> drops anything explicitly below

sources:
  # --- major boards (via JobSpy) ---
  linkedin:   { enabled: true,  max_results: 50 }
  indeed:     { enabled: true,  max_results: 50 }
  naukri:     { enabled: true,  max_results: 50 }
  google:     { enabled: true,  max_results: 40 }
  glassdoor:  { enabled: false, max_results: 30 }   # blocks hard, off by default
  wellfound:  { enabled: true,  max_results: 30 }   # needs `jobagent login wellfound`

  # --- India-specific boards ---
  india_boards:
    enabled: true
    max_results: 25
    providers: [instahyre, foundit, cutshort]

  # --- free public APIs (bonus coverage, zero ban risk) ---
  # adzuna + jooble genuinely index Indian roles; the rest are remote-first
  # boards where Indian candidates are routinely hired.
  free_apis:
    enabled: true
    max_results: 25
    providers: [adzuna, jooble, remotive, remoteok, himalayas, themuse, hackernews]
    # Free keys go in .env at the repo root (see .env.example):
    #   ADZUNA_APP_ID / ADZUNA_APP_KEY  -> developer.adzuna.com  (free, instant)
    #   JOOBLE_KEY                      -> jooble.org/api/about  (free, instant)
    #   THEMUSE_KEY                     -> themuse.com/developers (optional)

  # --- company career portals via official ATS JSON APIs ---
  # No scraping, no ban risk, complete JDs. This is the highest-signal source.
  # Add any company: find their board slug in the careers-page URL.
  ats_boards:
    enabled: true
    greenhouse:
      - razorpay
      - postman
      - zeta
      - browserstack
      - hasura
      - chargebee
      - freshworks
      - druva
      - innovaccer
      - mindtickle
      - whatfix
      - clevertap
      - gupshup
      - nutanix
      - rubrik
      - databricks
      - stripe
      - dream11
      - cred
      - phonepe
    lever:
      - swiggy
      - meesho
      - groww
      - upstox
      - jupiter
      - slice
      - navi
      - khatabook
      - leadsquared
      - springworks
    ashby:
      - sarvam-ai
      - atlan
      - hyperbots
      - fleetworks
      - devrev
      - portkey
      - composio

matching:
  # Stage 1 — embedding cosine similarity. Anything below this never reaches the LLM.
  embed_threshold: 0.55
  # Stage 2 — LLM score 0-100. Below this the job is auto-archived, not shown.
  llm_min_score: 70
  # Jobs at or above this are flagged "strong match" in the dashboard.
  strong_match_score: 85

apply:
  # false = fill the form and stop at Submit (dry run). true = actually submit.
  auto_submit: true
  # Never fire off more than this many real applications in one day.
  daily_apply_cap: 15
  # Seconds to wait between applications (human-like pacing, reduces ban risk).
  delay_between_s: [45, 120]
  # Pause and ask you instead of guessing, when a form has a question the
  # answer bank has never seen and the LLM confidence is low.
  ask_on_unknown_question: true
  # Generate a role-tailored cover letter with the local LLM for each apply.
  generate_cover_letter: true
  # Save a screenshot of every submitted application for your records.
  screenshot_evidence: true
  headless: false                 # keep false — LinkedIn/Naukri flag headless hard

schedule:
  enabled: true
  # Daily discovery + scoring run (24h clock, machine local time).
  discovery_time: "08:30"
  # Second sweep in the evening to catch same-day postings.
  discovery_time_2: "18:30"
  # How often to check for jobs you've approved and apply to them.
  apply_poll_minutes: 10

server:
  host: "127.0.0.1"
  port: 8765
  open_browser_on_start: true
